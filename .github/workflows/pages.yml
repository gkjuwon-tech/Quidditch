name: Deploy NIMBUS site to Pages

on:
  push:
    branches: ["claude/elegant-maxwell-l6w2j5", "main"]
    paths: ["broom/site/**", "broom/nimbus_fc/**", "broom/rust/**",
            "broom/scenarios/**", "broom/tests/**", "broom/tools/**",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Regenerate the in-page codebase exhibit so the Codex is always current
      # (stdlib-only; the GIFs are committed art and are not rebuilt here).
      - name: Build code exhibit
        run: python broom/tools/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: broom/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
