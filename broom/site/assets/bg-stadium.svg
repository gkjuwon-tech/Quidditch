<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.45" stop-color="#0e1638"/>
      <stop offset="0.75" stop-color="#1b1b4a"/>
      <stop offset="1" stop-color="#2a1c52"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.6" stop-color="#f2e6b8"/>
      <stop offset="1" stop-color="#f2e6b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd86b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2752"/>
      <stop offset="1" stop-color="#0a0f26"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c63" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2f6b" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fdf6d8">
    <circle cx="120" cy="80" r="1.4" opacity=".9"/><circle cx="300" cy="140" r="1" opacity=".6"/>
    <circle cx="520" cy="60" r="1.6" opacity=".95"/><circle cx="700" cy="120" r="1" opacity=".5"/>
    <circle cx="880" cy="70" r="1.3" opacity=".8"/><circle cx="1040" cy="150" r="1" opacity=".6"/>
    <circle cx="1230" cy="90" r="1.6" opacity=".9"/><circle cx="1420" cy="60" r="1.1" opacity=".7"/>
    <circle cx="1520" cy="170" r="1.3" opacity=".8"/><circle cx="210" cy="240" r="1" opacity=".5"/>
    <circle cx="430" cy="210" r="1.2" opacity=".7"/><circle cx="980" cy="240" r="1.1" opacity=".6"/>
    <circle cx="1330" cy="230" r="1.2" opacity=".7"/><circle cx="640" cy="280" r="1" opacity=".5"/>
    <circle cx="60" cy="180" r="1.1" opacity=".6"/><circle cx="1150" cy="60" r="1" opacity=".55"/>
    <circle cx="760" cy="40" r="1.2" opacity=".7"/><circle cx="1480" cy="300" r="1" opacity=".5"/>
  </g>

  <!-- moon -->
  <circle cx="1290" cy="180" r="150" fill="url(#moon)" opacity="0.5"/>
  <circle cx="1290" cy="180" r="64" fill="#fbf3d6" opacity="0.95"/>
  <circle cx="1320" cy="160" r="64" fill="#0e1638" opacity="0.55"/>

  <!-- far stadium rim silhouette -->
  <path d="M0,640 Q400,560 800,580 Q1200,600 1600,560 L1600,900 L0,900 Z" fill="#0c1230" opacity="0.9"/>
  <path d="M0,690 Q500,640 800,660 Q1150,684 1600,650 L1600,900 L0,900 Z" fill="#0a0f26"/>

  <!-- stadium crenellations -->
  <g fill="#10173a" opacity="0.95">
    <rect x="60" y="612" width="26" height="60"/><rect x="140" y="600" width="26" height="72"/>
    <rect x="1430" y="600" width="26" height="72"/><rect x="1510" y="616" width="26" height="60"/>
  </g>

  <!-- three glowing hoop towers (the goals) -->
  <g>
    <!-- left tower -->
    <rect x="250" y="430" width="16" height="300" fill="url(#tower)"/>
    <circle cx="258" cy="430" r="120" fill="url(#glow)" opacity="0.35"/>
    <circle cx="258" cy="430" r="46" fill="none" stroke="#ffd86b" stroke-width="7"/>
    <circle cx="258" cy="430" r="46" fill="none" stroke="#fff3c4" stroke-width="2"/>
    <!-- center tower (tallest) -->
    <rect x="792" y="360" width="18" height="370" fill="url(#tower)"/>
    <circle cx="801" cy="360" r="150" fill="url(#glow)" opacity="0.4"/>
    <circle cx="801" cy="360" r="56" fill="none" stroke="#ffd86b" stroke-width="8"/>
    <circle cx="801" cy="360" r="56" fill="none" stroke="#fff3c4" stroke-width="2"/>
    <!-- right tower -->
    <rect x="1334" y="470" width="16" height="260" fill="url(#tower)"/>
    <circle cx="1342" cy="470" r="110" fill="url(#glow)" opacity="0.33"/>
    <circle cx="1342" cy="470" r="40" fill="none" stroke="#ffd86b" stroke-width="6.5"/>
    <circle cx="1342" cy="470" r="40" fill="none" stroke="#fff3c4" stroke-width="2"/>
  </g>

  <!-- lone broom rider silhouette, mid-air -->
  <g transform="translate(560,300) rotate(-12)" fill="#05070f">
    <rect x="-70" y="-3" width="150" height="6" rx="3"/>
    <path d="M80,-3 L120,-12 L120,12 L80,3 Z" opacity="0.9"/>
    <circle cx="6" cy="-26" r="13"/>
    <path d="M-6,-16 q12,-6 24,0 l4,30 q-16,8 -32,0 z"/>
    <path d="M14,4 l26,16 M2,6 l-22,18" stroke="#05070f" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- golden snitch with wings -->
  <g transform="translate(1080,470)">
    <circle cx="0" cy="0" r="60" fill="url(#glow)" opacity="0.5"/>
    <path d="M-8,-4 q-46,-26 -64,2 q34,-2 58,12 Z" fill="#fbf3d6" opacity="0.85"/>
    <path d="M8,-4 q46,-26 64,2 q-34,-2 -58,12 Z" fill="#fbf3d6" opacity="0.85"/>
    <circle cx="0" cy="2" r="11" fill="#ffd86b" stroke="#fff7e0" stroke-width="1.5"/>
  </g>

  <!-- low mist -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#mist)"/>
</svg>
